<!doctype html>
<html lang="en-gb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video player</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
  </head>
  <body>
    <div class="player">
      <video controls>
        <source
          src="https://archive.org/download/turner_video_393320/393320.mp4"
          type="video/mp4" />
        <source
          src="https://archive.org/download/turner_video_393320/393320.webm"
          type="video/webm" />
      </video>
      <div class="controls">
        <button
          class="play"
          data-icon="P"
          aria-label="play pause toggle"></button>
        <button class="stop" data-icon="S" aria-label="stop"></button>
        <div class="timer">
          <div></div>
          <span>00:00</span>
        </div>
        <button class="rwd" data-icon="B" aria-label="rewind"></button>
        <button class="fwd" data-icon="F" aria-label="fast forward"></button>
      </div>
    </div>
    <p>
      Amélie (trailer) &copy; copyright Internet Archive |
      <a href="https://archive.org/details/turner_video_393320"
        >archive.org/details/turner_video_393320</a
      >.
    </p>
    <script src="custom-player.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html>

<head>
  <title>SVG Clock</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles/light.css" />
  <script type="text/javascript" src="scripts/trigonometry.js"></script>
</head>

<body>
  <div class="half">
    <div id="txt">texto</div>
  </div>

  <svg id="clock" viewBox="0 0 200 200">
    <circle id="myCircle" cx="100" cy="70" r="50" fill="white" stroke="#db4e36" stroke-width="3" />
    <line id="hou" x1="100" y1="70" x2="110" y2="80" style="stroke:#db4e36;stroke-width:5" />
    <line id="min" x1="100" y1="70" x2="80" y2="40" style="stroke:#db4e36;stroke-width:3" />
    <line id="sec" x1="100" y1="70" x2="115" y2="45" style="stroke:black;stroke-width:1" />
  </svg>
</body>

</html>

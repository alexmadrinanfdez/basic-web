<!DOCTYPE html>
<html>

<head>
    <title>Gallery</title>
    <meta charset="UTF-8">
    <script type="text/javascript" src="zepto.min.js"></script>
    <link href='http://fonts.googleapis.com/css?family=Droid+Sans:400,700' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="styles/dark.css" />
    <script src="scripts/graphic.js"></script>
</head>

<body onload="init(80, 80); doAnim(80, 80);">
    <h1>CLOCK</h1>
    <svg id="clock" xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">

        <circle id='myCircle' cx='80' cy='80' r='50' stroke='white' stroke-width='1' />
        <line stroke-linecap="round" id="hou" x1='80' y1='80' x2='80' y2='50' style='stroke:white;stroke-width:3' />
        <line stroke-linecap="round" id="min" id="min" x1='80' y1='80' x2='80' y2='40'
            style='stroke:white;stroke-width:3' />
        <line id="sec" x1='80' y1='80' x2='80' y2='30' style='stroke:red;stroke-width:1' />

    </svg>
</body>

</html>
